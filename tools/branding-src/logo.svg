<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Rim: bright top-left -> deep bottom-right (light from upper left) -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="RIM_HI"/>
      <stop offset="0.45" stop-color="ACCENT"/>
      <stop offset="1" stop-color="RIM_LO"/>
    </linearGradient>
    <!-- Shield body: deep navy vertical falloff -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122344"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#060D1C"/>
    </linearGradient>
    <!-- Iris: luminous core -> deep edge -->
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="IRIS_HI"/>
      <stop offset="0.55" stop-color="ACCENT"/>
      <stop offset="1" stop-color="IRIS_LO"/>
    </radialGradient>
    <!-- Rim hotspot: light catches the top-left edge -->
    <radialGradient id="hotspot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Socket inner shading: darker at the top -->
    <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060F"/>
      <stop offset="0.55" stop-color="#050D1A"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <!-- Ambient glow behind the eye -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="ACCENT" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="ACCENT" stop-opacity="0.08"/>
      <stop offset="1" stop-color="ACCENT" stop-opacity="0"/>
    </radialGradient>
    <!-- Top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="innerClip">
      <path d="M128 31 C160 31 187 37 199 47 C202 124 186 180 128 220 C70 180 54 124 57 47 C69 37 96 31 128 31 Z"/>
    </clipPath>
  </defs>

  <!-- Shield rim -->
  <path fill="url(#rim)" d="M128 20 C164 20 196 27 210 38 C214 124 195 187 128 232 C61 187 42 124 46 38 C60 27 92 20 128 20 Z"/>
  <!-- rim light catch -->
  <ellipse cx="84" cy="34" rx="52" ry="26" fill="url(#hotspot)" transform="rotate(-18 84 34)"/>
  <!-- Shield body -->
  <path fill="url(#body)" d="M128 31 C160 31 187 37 199 47 C202 124 186 180 128 220 C70 180 54 124 57 47 C69 37 96 31 128 31 Z"/>
  <!-- Hairline inside the rim -->
  <path fill="none" stroke="ACCENT" stroke-opacity="0.35" stroke-width="1.4" d="M128 33.5 C158.5 33.5 184.5 39.3 196.5 49 C199.3 123 184.3 177.5 128 217 C71.7 177.5 56.7 123 59.5 49 C71.5 39.3 97.5 33.5 128 33.5 Z"/>

  <g clip-path="url(#innerClip)">
    <!-- top sheen -->
    <ellipse cx="128" cy="42" rx="95" ry="48" fill="url(#sheen)"/>
    <!-- ambient glow -->
    <ellipse cx="128" cy="116" rx="72" ry="48" fill="url(#glow)"/>
  </g>

  <!-- Eye socket: shaded lens with thin accent stroke -->
  <path d="M82 114 Q128 76 174 114 Q128 152 82 114 Z"
        fill="url(#socket)" stroke="ACCENT" stroke-width="4" stroke-linejoin="round"/>
  <!-- Iris + inner ring + pupil + specular -->
  <circle cx="128" cy="114" r="23" fill="url(#iris)"/>
  <circle cx="128" cy="114" r="23" fill="none" stroke="IRIS_HI" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="128" cy="114" r="15.5" fill="none" stroke="#060D1C" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="128" cy="114" r="10" fill="#060D1C"/>
  <circle cx="135.5" cy="105.5" r="3.8" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
