<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 343 96">
<defs>

    <!-- Rim: bright top-left -> deep bottom-right (light from upper left) -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <!-- Shield body: deep navy vertical falloff -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122344"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#060D1C"/>
    </linearGradient>
    <!-- Iris: luminous core -> deep edge -->
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#155E75"/>
    </radialGradient>
    <!-- Rim hotspot: light catches the top-left edge -->
    <radialGradient id="hotspot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Socket inner shading: darker at the top -->
    <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060F"/>
      <stop offset="0.55" stop-color="#050D1A"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <!-- Ambient glow behind the eye -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <!-- Top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="innerClip">
      <path d="M128 31 C160 31 187 37 199 47 C202 124 186 180 128 220 C70 180 54 124 57 47 C69 37 96 31 128 31 Z"/>
    </clipPath>
  
  <linearGradient id="wm-text" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#BAE6FD"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/>
  </linearGradient>
</defs>
  <g transform="translate(2,20) scale(0.21875)">
    <path fill="url(#rim)" d="M128 20 C164 20 196 27 210 38 C214 124 195 187 128 232 C61 187 42 124 46 38 C60 27 92 20 128 20 Z"/>
    <path fill="url(#body)" d="M128 31 C160 31 187 37 199 47 C202 124 186 180 128 220 C70 180 54 124 57 47 C69 37 96 31 128 31 Z"/>
    <path d="M82 114 Q128 76 174 114 Q128 152 82 114 Z" fill="url(#socket)" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="128" cy="114" r="23" fill="url(#iris)"/>
    <circle cx="128" cy="114" r="23" fill="none" stroke="#A5F3FC" stroke-opacity="0.55" stroke-width="1.6"/>
    <circle cx="128" cy="114" r="10" fill="#060D1C"/>
    <circle cx="135.5" cy="105.5" r="3.8" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>
